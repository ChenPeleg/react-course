
name: Ice cream app CI
 
on:
  push: 

jobs:
  build:

    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.xx
        uses: actions/setup-node@v3
        with:
          node-version: 24.xx
          cache: 'npm'
          cache-dependency-path: './'
      - run: npm install
      - run: npm test
